name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 手动重跑（分支上验证修复时用；默认只在 main / PR 上跑）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show versions
        run: python --version && git --version
      - name: Configure git for the test fixtures
        # 测试里会临时 git init/commit；runner 上没有全局身份，
        # 也没人设 init.defaultBranch，统一在这里补上。
        run: |
          git config --global user.name "calltable ci"
          git config --global user.email "ci@calltable.invalid"
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check the CLI entry points
        run: python -m calltable --version
