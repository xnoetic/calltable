[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calltable"
version = "0.3.0"
description = "A verification task queue for AI coding agents: take a ticket, wait in line, get called."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The calltable Authors" }]
keywords = ["ci", "queue", "agents", "testing", "executor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xnoetic/calltable"
Issues = "https://github.com/xnoetic/calltable/issues"

[project.scripts]
calltable = "calltable.cli:main"
ct = "calltable.cli:main"

[tool.setuptools]
packages = ["calltable"]

[tool.setuptools.package-data]
calltable = ["cloudrun_assets/*"]
