<text x="1020" y="242" class="t2 mono" font-size="19">#0141</text>
<circle cx="1110" cy="236" r="4.5" class="acc"/>
<text x="1122" y="242" class="acc mono" font-size="18">running</text>
<text x="874" y="276" class="t mono" font-size="19">runner-b</text>
<text x="1020" y="276" class="t2 mono" font-size="19">#0142</text>
<circle cx="1110" cy="270" r="4.5" class="acc"/>
<text x="1122" y="276" class="acc mono" font-size="18">running</text>
<text x="874" y="310" class="t mono" font-size="19">cloudrun</text>
<text x="1020" y="310" class="t2 mono" font-size="19">—</text>
<circle cx="1110" cy="304" r="4.5" class="dim"/>
