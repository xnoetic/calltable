<text x="176" y="154" class="t" font-size="62" font-weight="700" letter-spacing="-1.5">calltable</text>
<text x="82" y="236" font-size="30" font-weight="650" class="t" xml:space="preserve"><tspan class="t">Take a ticket.</tspan><tspan class="t"> Wait in line.</tspan><tspan fill="url(#tagGrad)"> Get called.</tspan></text>
<text x="82" y="278" class="t2" font-size="21">A verification task queue for AI coding agents</text>
