<rect x="848.6" y="62.6" width="370.8" height="274.8" rx="17.4" fill="none" stroke="url(#brandGrad)" stroke-opacity=".55" stroke-width="1.2"/>
<circle cx="878" cy="98" r="5.5" class="ok pulse"/>
<text x="894" y="104" class="dim" font-size="18" font-weight="700" letter-spacing="2.5">NOW SERVING</text>
<text x="874" y="180" class="mono pulse" font-size="58" font-weight="700" fill="url(#numGrad)">#0142</text>
<text x="1192" y="174" class="t2 mono" font-size="18" text-anchor="end">→ runner-b</text>
