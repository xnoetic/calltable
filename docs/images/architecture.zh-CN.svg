<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-labelledby="t d" xml:lang="zh-CN">
<title id="t">calltable 架构</title>
<desc id="d">AI agent（Claude Code、Codex 或任意 shell）用 ct run 把工作区快照打包成 git bundle 连同任务发给 hub，拿回取号回执、退出码、日志和产物。hub（HTTP JSON API、SQLite、bare git 镜像、调度器、janitor、看板、webhook）把任务派给执行器：Linux 上的 runner-a 和 Windows 上的 runner-b 领取任务、发心跳、上报完成；cloudrun 主机是按需拉起的 Google Cloud Run job，由 gcloud run jobs execute 启动后 attach 回 hub。</desc>
<style>:root{--bg:#eef2f8;--panel:#ffffff;--panel2:#f1f5fb;--line:rgba(15,23,42,.12);--text:#101a28;--text2:#33455c;--dim:#5c6d82;--acc:#1f6feb;--acc2:#7048e8;--ok:#0e9f6e;--bad:#d92c2c;--warn:#b7791f;--g1:#2f7fe0;--g2:#7350e6;--tileop:.09;--edgeop:.9;--shadow:rgba(15,23,42,.10);--glow:.10}
@media (prefers-color-scheme: dark){:root{--bg:#070a10;--panel:#111927;--panel2:#1a2433;--line:rgba(255,255,255,.10);--text:#e9eff7;--text2:#c2cfdd;--dim:#8ea0b5;--acc:#5ba8ff;--acc2:#9b8cff;--ok:#3ddc97;--bad:#ff7070;--warn:#f5b544;--g1:#6cb6ff;--g2:#a99bff;--tileop:.13;--edgeop:.5;--shadow:rgba(0,0,0,.45);--glow:.16}}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;}
.mono{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, &quot;Cascadia Mono&quot;, Consolas, monospace;}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.panel2{fill:var(--panel2);stroke:var(--line);stroke-width:1}
.t{fill:var(--text)} .t2{fill:var(--text2)} .dim{fill:var(--dim)}
.acc{fill:var(--acc)} .acc2{fill:var(--acc2)} .ok{fill:var(--ok)} .bad{fill:var(--bad)} .warn{fill:var(--warn)}
.st1{stop-color:var(--g1)} .st2{stop-color:var(--g2)}
.sa{stop-color:var(--acc)} .sb{stop-color:var(--acc2)}
.tile{fill-opacity:var(--tileop)} .edge{stroke-opacity:var(--edgeop)}
.ln{stroke:var(--line)}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.haloP{paint-order:stroke;stroke:var(--panel);stroke-width:6px;stroke-linejoin:round}
.ar{fill:none;stroke-width:2;stroke-linecap:round}
.ar-acc{stroke:var(--acc)} .ar-acc2{stroke:var(--acc2)} .ar-dim{stroke:var(--dim)} .ar-ok{stroke:var(--ok)}
.mk-acc{fill:var(--acc)} .mk-acc2{fill:var(--acc2)} .mk-dim{fill:var(--dim)} .mk-ok{fill:var(--ok)}
.flow{stroke-dasharray:7 7;animation:flow 1.4s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.flow,.pulse{animation:none}}</style>
<defs>
<linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1"><stop class="st1" offset="0"/><stop class="st2" offset="1"/></linearGradient>
<radialGradient id="glowA"><stop class="sa" offset="0" stop-opacity=".9"/><stop class="sa" offset="1" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop class="sb" offset="0" stop-opacity=".9"/><stop class="sb" offset="1" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" style="fill:var(--dim)" opacity=".22"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" style="flood-color:var(--shadow)"/></filter>
<marker id="ah-acc" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L10.5 6L1.5 10.5L4 6Z" class="mk-acc"/></marker><marker id="ah-acc2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L10.5 6L1.5 10.5L4 6Z" class="mk-acc2"/></marker><marker id="ah-dim" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L10.5 6L1.5 10.5L4 6Z" class="mk-dim"/></marker><marker id="ah-ok" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L10.5 6L1.5 10.5L4 6Z" class="mk-ok"/></marker>
<symbol id="mark" viewBox="0 0 40 40">
<rect class="tile" x="1.5" y="1.5" width="37" height="37" rx="11" fill="url(#brandGrad)"/>
<rect class="edge" x="1.5" y="1.5" width="37" height="37" rx="11" fill="none" stroke="url(#brandGrad)"/>
<path d="M11 10h12.6a2 2 0 0 1 2 2v3.4a2.8 2.8 0 0 0 0 5.6V26a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2v-5a2.8 2.8 0 0 0 0-5.6V12a2 2 0 0 1 2-2Z" fill="none" stroke="url(#brandGrad)" stroke-width="1.7" stroke-linejoin="round"/>
<path d="M15.7 11.4v15.2" stroke="url(#brandGrad)" stroke-width="1.3" stroke-dasharray="1.8 2.4" opacity=".75"/>
<path d="M19.6 15.2h5.2M19.6 19h5.2M19.6 22.8h3.2" stroke="url(#brandGrad)" stroke-width="1.7" stroke-linecap="round"/>
</symbol>

</defs>
<rect class="bg" x="0" y="0" width="1280" height="680" rx="20"/>
<circle cx="640" cy="380" r="420" fill="url(#glowA)" style="opacity:var(--glow)"/>
<circle cx="1150" cy="560" r="260" fill="url(#glowB)" style="opacity:var(--glow)"/>
<text x="40" y="58" class="t" font-size="28" font-weight="700">架构</text>
<text x="118.0" y="58" class="dim" font-size="18">一个权威 hub · 每台机器一个执行器</text>
<rect x="40" y="250" width="190" height="240" rx="16" class="panel"/>
<text x="62" y="290" class="t" font-size="20" font-weight="700">AI agent</text>
<circle cx="68" cy="326" r="4" class="acc"/>
<text x="82" y="332" class="t2" font-size="18">Claude Code</text>
<circle cx="68" cy="362" r="4" class="acc"/>
<text x="82" y="368" class="t2" font-size="18">Codex</text>
<circle cx="68" cy="398" r="4" class="acc"/>
<text x="82" y="404" class="t2" font-size="18">任意 shell</text>
<rect x="60" y="430" width="150" height="36" rx="10" class="panel2"/>
<text x="74" y="454" class="acc mono" font-size="18" font-weight="600">$ ct run</text>
<g filter="url(#shadow)"><rect x="420" y="96" width="440" height="544" rx="18" class="panel"/></g>
<rect x="420.8" y="96.8" width="438.4" height="542.4" rx="17.2" fill="none" stroke="url(#brandGrad)" stroke-width="1.6"/>
<use href="#mark" x="446" y="120" width="44" height="44"/>
<text x="504" y="150" class="t mono" font-size="28" font-weight="700">hub</text>
<text x="568.4" y="149" class="dim" font-size="18">唯一的权威调度中心</text>
<path d="M444 184H836" class="ln" stroke-width="1.2"/>
<rect x="448" y="205" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="218" class="t" font-size="19" font-weight="650">HTTP JSON API</text>
<text x="470" y="243" class="t2" font-size="18">bearer token · 长轮询 · SSE</text>
<rect x="448" y="265" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="278" class="t" font-size="19" font-weight="650">SQLite</text>
<text x="470" y="303" class="t2" font-size="18">任务、主机、日志、采样、产物</text>
<rect x="448" y="325" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="338" class="t" font-size="19" font-weight="650">bare git 镜像</text>
<text x="470" y="363" class="t2" font-size="18">推送来的 bundle 落在这里</text>
<rect x="448" y="385" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="398" class="t" font-size="19" font-weight="650">调度器</text>
<rect x="539.0" y="379" width="60.0" height="26" rx="13.0" style="fill:var(--acc2);fill-opacity:.12;stroke:var(--acc2);stroke-opacity:.45"/>
<text x="553.0" y="397.6" class="acc2" font-size="16">原子</text>
<text x="470" y="423" class="t2" font-size="18">主机 + 槽位 + 每把命名锁</text>
<rect x="448" y="445" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="458" class="t" font-size="19" font-weight="650">janitor</text>
<text x="470" y="483" class="t2" font-size="18">心跳对账</text>
<rect x="448" y="505" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="518" class="t" font-size="19" font-weight="650">看板</text>
<text x="470" y="543" class="t2" font-size="18">单页实时视图</text>
<rect x="448" y="565" width="10" height="10" rx="3" class="acc" opacity=".85"/>
<text x="470" y="578" class="t" font-size="19" font-weight="650">webhook</text>
<text x="470" y="603" class="t2" font-size="18">签名的 job.started / job.finished</text>
<path d="M242 330L408 330" class="ar ar-acc flow" marker-end="url(#ah-acc)"/>
<path d="M408 410L242 410" class="ar ar-ok" marker-end="url(#ah-ok)"/>
<text x="325.0" y="262" class="t" font-size="18" text-anchor="middle" font-weight="600">工作区快照</text>
<text x="325.0" y="284" class="t2" font-size="18" text-anchor="middle">打成 git bundle</text>
<text x="325.0" y="306" class="t2" font-size="18" text-anchor="middle">+ 任务</text>
<text x="325.0" y="440" class="t" font-size="18" text-anchor="middle" font-weight="600">取号回执</text>
<text x="325.0" y="462" class="t2" font-size="18" text-anchor="middle">退出码 · 日志</text>
<text x="325.0" y="484" class="t2" font-size="18" text-anchor="middle">产物</text>
<rect x="1050" y="96" width="190" height="140" rx="16" class="panel"/>
<text x="1072" y="136" class="t mono" font-size="20" font-weight="700">runner-a</text>
<circle cx="1216" cy="129" r="5" class="ok"/>
<text x="1072" y="170" class="t2" font-size="18" font-weight="600">Linux</text>
<text x="1072" y="198" class="dim mono" font-size="18">systemd scope</text>
<path d="M872 166L1038 166" class="ar ar-dim" marker-end="url(#ah-dim)" marker-start="url(#ah-dim)"/>
<rect x="1050" y="262" width="190" height="140" rx="16" class="panel"/>
<text x="1072" y="302" class="t mono" font-size="20" font-weight="700">runner-b</text>
<circle cx="1216" cy="295" r="5" class="ok"/>
<text x="1072" y="336" class="t2" font-size="18" font-weight="600">Windows</text>
<text x="1072" y="364" class="dim mono" font-size="18">Job Object</text>
<path d="M872 332L1038 332" class="ar ar-dim" marker-end="url(#ah-dim)" marker-start="url(#ah-dim)"/>
<text x="955.0" y="226" class="t2" font-size="18" text-anchor="middle">领取</text>
<text x="955.0" y="249" class="t2" font-size="18" text-anchor="middle">心跳</text>
<text x="955.0" y="272" class="t2" font-size="18" text-anchor="middle">完成</text>
<rect x="1050" y="430" width="190" height="210" rx="16" style="fill:var(--acc2);fill-opacity:.06;stroke:var(--acc2);stroke-opacity:.7" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="1072" y="470" class="t mono" font-size="20" font-weight="700">cloudrun</text>
<text x="1072" y="502" class="t2" font-size="18" font-weight="600">Cloud Run job</text>
<text x="1072" y="528" class="dim" font-size="18">Google Cloud</text>
<rect x="1072.0" y="548" width="80.0" height="32" rx="16.0" style="fill:var(--acc2);fill-opacity:.12;stroke:var(--acc2);stroke-opacity:.45"/>
<circle cx="1089.0" cy="564.0" r="4.5" style="fill:var(--acc2)"/>
<text x="1102.0" y="570.3" class="acc2" font-size="18">按需</text>
<text x="1072" y="612" class="dim" font-size="18">空闲时缩到零</text>
<path d="M872 506L1038 506" class="ar ar-acc2 flow" marker-end="url(#ah-acc2)"/>
<text x="955.0" y="468" class="acc2 mono" font-size="18" text-anchor="middle">gcloud run</text>
<text x="955.0" y="490" class="acc2 mono" font-size="18" text-anchor="middle">jobs execute</text>
<path d="M1038 594L872 594" class="ar ar-acc2" marker-end="url(#ah-acc2)"/>
<text x="955.0" y="580" class="acc2 mono" font-size="18" text-anchor="middle">attach</text>
</svg>
